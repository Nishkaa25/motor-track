[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-engine"
version = "1.0.0"
description = "MotorTrack: Smartphone-Based Motor Symptom Monitoring & Quantitative Assessment Research Prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "pillow>=12.0.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "qrcode>=8.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.13.1",
    "SQLAlchemy>=2.0.52",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    "websockets>=17.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
